name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag past v7, so pin the exact release
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          working-directory: apps/backend
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      # The eval harness end to end with a scripted model: no endpoint, no network (ADR 0004)
      - name: Eval harness (mocked)
        run: uv run python -m evals --mocked --out "$RUNNER_TEMP/evals-report.md"

  dataset:
    name: dataset (regenerate + diff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag past v7, so pin the exact release
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          working-directory: apps/backend
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Regenerate dataset
        run: uv run python scripts/generate_dataset.py

      - name: Diff against committed dataset
        run: git diff --exit-code -- employees.csv poisoned_manifest.json

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  images:
    name: images (compose build)
    runs-on: ubuntu-latest
    env:
      # Compose interpolates the whole file before it builds, so the two required variables must
      # be set even though an image build reads neither. Placeholders, not secrets.
      OLLAMA_BASE_URL: http://localhost:11434
      JWT_SECRET: unused-by-image-build
    steps:
      - uses: actions/checkout@v7

      - name: Build both images
        run: docker compose build

  cd:
    name: cd (publish images to GHCR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, dataset, frontend, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: secure-rls-backend
            context: apps/backend
          - image: secure-rls-frontend
            context: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/tomasholas/${{ matrix.image }}:latest
            ghcr.io/tomasholas/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
